apiVersion: apps/v1
kind: Deployment
metadata:
  name: agente
  labels:
    app: agente
spec:
  # Obligatorio 1 réplica: el historial de conversaciones vive en memoria (LRU+TTL)
  # y se pierde al reiniciar. Escalar a >1 réplica requiere migrar ConversationStore a Redis.
  replicas: 1
  selector:
    matchLabels:
      app: agente
  template:
    metadata:
      labels:
        app: agente
    spec:
      containers:
        - name: agente
          image: tutormatch-agente:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: PORT
              value: "8081"
            - name: GEMINI_MODEL
              value: "gemini-flash-lite-latest"
            - name: BFF_URL
              value: "http://bff:3000/graphql"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agente-secrets
                  key: gemini-api-key
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: agente
  labels:
    app: agente
spec:
  # Uso estrictamente interno (ClusterIP): NO exponer hacia fuera del clúster
  # porque /mcp identifica al usuario mediante la cabecera X-Usuario-Id sin verificar JWT.
  type: ClusterIP
  selector:
    app: agente
  ports:
    - name: http
      port: 8081
      targetPort: 8081