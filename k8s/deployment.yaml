apiVersion: apps/v1
kind: Deployment
metadata:
  name: tutormatch-agente
  labels:
    app: tutormatch-agente
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tutormatch-agente
  template:
    metadata:
      labels:
        app: tutormatch-agente
    spec:
      containers:
        - name: agente
          image: tutormatch-agente:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: GEMINI_MODEL
              value: "gemini-flash-lite-latest"
            - name: BFF_URL
              value: "http://tutormatch-bff:3000/graphql"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: tutormatch-agente-secrets
                  key: gemini-api-key
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: tutormatch-agente
  labels:
    app: tutormatch-agente
spec:
  type: ClusterIP
  selector:
    app: tutormatch-agente
  ports:
    - name: http
      port: 8080
      targetPort: 8080